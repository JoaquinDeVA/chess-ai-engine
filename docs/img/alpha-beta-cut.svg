<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">An alpha-beta cut</title>
  <desc id="d">A MAX node with two MIN children. The left child searches two leaves and returns 3. The right child finds a leaf worth 2, which is already worse than the 3 the root can get, so its second leaf is never searched.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .q { font-size: 15px; }
    .label { font-size: 15px; }
    .small { font-size: 13px; }
    .bold { font-weight: 700; }
    .on { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .cut { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .blue { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .gray { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 5 4; }
    .edge { stroke: #15803d; stroke-width: 2.5; fill: none; }
    .edge-cut { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .t-green { fill: #14532d; }
    .t-red { fill: #7f1d1d; }
    .t-blue { fill: #1e3a8a; }
    .t-gray { fill: #374151; }
  </style>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="38" class="title">Alpha-beta: a branch that cannot change the answer is dropped</text>

  <!-- edges -->
  <path class="edge" d="M 400 98 L 230 170"/>
  <path class="edge" d="M 400 98 L 570 170"/>
  <path class="edge" d="M 230 208 L 140 292"/>
  <path class="edge" d="M 230 208 L 320 292"/>
  <path class="edge" d="M 570 208 L 480 292"/>
  <path class="edge-cut" d="M 570 208 L 660 292"/>

  <!-- root -->
  <rect x="350" y="62" width="100" height="40" rx="8" class="on"/>
  <text x="400" y="88" text-anchor="middle" class="label bold t-green">MAX = 3</text>
  <!-- MIN nodes -->
  <rect x="180" y="170" width="100" height="40" rx="8" class="on"/>
  <text x="230" y="196" text-anchor="middle" class="label bold t-green">MIN = 3</text>
  <rect x="520" y="170" width="100" height="40" rx="8" class="on"/>
  <text x="570" y="196" text-anchor="middle" class="label bold t-green">MIN ≤ 2</text>
  <!-- leaves -->
  <rect x="110" y="292" width="60" height="40" rx="8" class="on"/>
  <text x="140" y="318" text-anchor="middle" class="label bold t-green">3</text>
  <rect x="290" y="292" width="60" height="40" rx="8" class="on"/>
  <text x="320" y="318" text-anchor="middle" class="label bold t-green">5</text>
  <rect x="450" y="292" width="60" height="40" rx="8" class="on"/>
  <text x="480" y="318" text-anchor="middle" class="label bold t-green">2</text>
  <rect x="630" y="292" width="60" height="40" rx="8" class="cut"/>
  <text x="660" y="318" text-anchor="middle" class="label bold t-red">?</text>
  <path d="M 612 252 L 644 232" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 624 266 L 656 246" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>

  <!-- notes -->
  <rect x="470" y="66" width="190" height="32" rx="6" class="blue"/>
  <text x="565" y="87" text-anchor="middle" class="small bold t-blue">root already has α = 3</text>
  <text x="660" y="352" text-anchor="middle" class="small bold t-red">never searched</text>
  <text x="676" y="246" class="small bold t-red">2 ≤ α: cut</text>

  <!-- legend -->
  <rect x="24" y="372" width="18" height="18" rx="4" class="on"/>
  <text x="50" y="387" class="small">searched</text>
  <rect x="140" y="372" width="18" height="18" rx="4" class="cut"/>
  <text x="166" y="387" class="small">pruned</text>
  <rect x="250" y="372" width="18" height="18" rx="4" class="blue"/>
  <text x="276" y="387" class="small">bound (α)</text>
  <text x="24" y="418" class="q bold">Why can the second leaf of the right branch be skipped?</text>
  <text x="24" y="438" class="q">The MIN node already found 2, below the 3 the root can get, so it cannot change the answer.</text>
</svg>
