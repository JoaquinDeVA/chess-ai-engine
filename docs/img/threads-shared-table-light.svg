<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="t d">
  <title id="t">Lazy SMP: depths per thread, shared memory and the vote</title>
  <desc id="d">Top: which depths each of six threads searches between depths 6 and 11; the main thread searches all of them and each helper skips a pattern of depths set by its index. Middle: the transposition table and the history scores are shared by all threads, the killer moves belong to each thread. Bottom: a vote among four threads; the main thread voted e4 with depth 8, helpers 1 and 2 voted d4 with depths 8 and 9, helper 3 voted e4 with depth 8; d4 has weight 1.29 against 0.32 for e4 and is played.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; font-size: 14px; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #475569; }
    .b { font-weight: 700; }
    .on { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
    .skip { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .blue { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .amber { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .win { fill: #bbf7d0; stroke: #15803d; stroke-width: 2; }
    .line { stroke: #475569; stroke-width: 1.5; fill: none; }
  </style>
  <text class="title" x="20" y="28">1. Depths each thread searches (the main thread is at depth 6 and climbs)</text>

  <text class="sub" x="220.0" y="52" text-anchor="middle">depth 6</text>
  <text class="sub" x="280.0" y="52" text-anchor="middle">depth 7</text>
  <text class="sub" x="340.0" y="52" text-anchor="middle">depth 8</text>
  <text class="sub" x="400.0" y="52" text-anchor="middle">depth 9</text>
  <text class="sub" x="460.0" y="52" text-anchor="middle">depth 10</text>
  <text class="sub" x="520.0" y="52" text-anchor="middle">depth 11</text>
  <text x="20" y="79" class="b">Main</text>
  <rect class="on" x="193" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="79" text-anchor="middle">search</text>
  <rect class="on" x="253" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="79" text-anchor="middle">search</text>
  <rect class="on" x="313" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="79" text-anchor="middle">search</text>
  <rect class="on" x="373" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="79" text-anchor="middle">search</text>
  <rect class="on" x="433" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="79" text-anchor="middle">search</text>
  <rect class="on" x="493" y="62" width="54" height="24" rx="4"/>
  <text class="sub" x="520.0" y="79" text-anchor="middle">search</text>
  <text x="20" y="109" class="">Helper 1  (size 1, phase 0)</text>
  <rect class="on" x="193" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="109" text-anchor="middle">search</text>
  <rect class="skip" x="253" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="109" text-anchor="middle">skip</text>
  <rect class="on" x="313" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="109" text-anchor="middle">search</text>
  <rect class="skip" x="373" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="109" text-anchor="middle">skip</text>
  <rect class="on" x="433" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="109" text-anchor="middle">search</text>
  <rect class="skip" x="493" y="92" width="54" height="24" rx="4"/>
  <text class="sub" x="520.0" y="109" text-anchor="middle">skip</text>
  <text x="20" y="139" class="">Helper 2  (size 1, phase 1)</text>
  <rect class="skip" x="193" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="139" text-anchor="middle">skip</text>
  <rect class="on" x="253" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="139" text-anchor="middle">search</text>
  <rect class="skip" x="313" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="139" text-anchor="middle">skip</text>
  <rect class="on" x="373" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="139" text-anchor="middle">search</text>
  <rect class="skip" x="433" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="139" text-anchor="middle">skip</text>
  <rect class="on" x="493" y="122" width="54" height="24" rx="4"/>
  <text class="sub" x="520.0" y="139" text-anchor="middle">search</text>
  <text x="20" y="169" class="">Helper 3  (size 2, phase 0)</text>
  <rect class="skip" x="193" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="169" text-anchor="middle">skip</text>
  <rect class="skip" x="253" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="169" text-anchor="middle">skip</text>
  <rect class="on" x="313" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="169" text-anchor="middle">search</text>
  <rect class="on" x="373" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="169" text-anchor="middle">search</text>
  <rect class="skip" x="433" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="169" text-anchor="middle">skip</text>
  <rect class="skip" x="493" y="152" width="54" height="24" rx="4"/>
  <text class="sub" x="520.0" y="169" text-anchor="middle">skip</text>
  <text x="20" y="199" class="">Helper 4  (size 2, phase 1)</text>
  <rect class="skip" x="193" y="182" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="199" text-anchor="middle">skip</text>
  <rect class="on" x="253" y="182" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="199" text-anchor="middle">search</text>
  <rect class="on" x="313" y="182" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="199" text-anchor="middle">search</text>
  <rect class="skip" x="373" y="182" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="199" text-anchor="middle">skip</text>
  <rect class="skip" x="433" y="182" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="199" text-anchor="middle">skip</text>
  <rect class="on" x="493" y="182" width="54" height="24" rx="4"/>
