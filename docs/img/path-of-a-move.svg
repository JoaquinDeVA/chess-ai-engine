<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">From the board to a move</title>
  <desc id="d">Flowchart of how the bot chooses a move. First it asks whether the game still follows the opening book and the position is in it; if so it plays the book move. Otherwise, if the position has five pieces or fewer and no castling rights, it plays the Syzygy tablebase move. Otherwise it searches with iterative deepening (depth 1, 2, 3, and so on), using alpha-beta, a transposition table, quiescence and the model's evaluation, and plays the move of the deepest finished depth when the time budget runs out. Illustrative diagram; no measured values.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .q { font-size: 15px; }
    .label { font-size: 15px; }
    .small { font-size: 13px; }
    .bold { font-weight: 700; }
    .on { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .cut { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .blue { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .gray { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 5 4; }
    .edge { stroke: #15803d; stroke-width: 2.5; fill: none; }
    .edge-cut { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .t-green { fill: #14532d; }
    .t-red { fill: #7f1d1d; }
    .step { fill: #ffffff; stroke: #475569; stroke-width: 2; }
    .t-step { fill: #0f172a; }
    .t-blue { fill: #1e3a8a; }
    .t-gray { fill: #374151; }
  </style>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="38" class="title">From the board to a move: the first test that applies wins</text>

  <!-- edges -->
  <path class="edge" d="M 260 100 L 260 128"/>
  <path class="edge" d="M 480 148 L 548 148"/>
  <path class="edge" d="M 260 168 L 260 196"/>
  <path class="edge" d="M 480 216 L 548 216"/>
  <path class="edge" d="M 260 236 L 260 264"/>
  <path class="edge" d="M 480 300 L 548 300"/>

  <!-- start -->
  <rect x="40" y="60" width="440" height="40" rx="8" class="step"/>
  <text x="260" y="85" text-anchor="middle" class="label bold t-step">Position to move</text>

  <!-- 1. opening book -->
  <rect x="40" y="128" width="440" height="40" rx="8" class="step"/>
  <text x="260" y="153" text-anchor="middle" class="label bold t-step">Game still in the book, and the position in it?</text>
  <rect x="548" y="128" width="228" height="40" rx="8" class="on"/>
  <text x="662" y="153" text-anchor="middle" class="label bold t-green">Play the book move</text>
  <text x="514" y="142" text-anchor="middle" class="small">yes</text>
  <text x="270" y="186" class="small">no</text>

  <!-- 2. tablebases -->
  <rect x="40" y="196" width="440" height="40" rx="8" class="step"/>
  <text x="260" y="221" text-anchor="middle" class="label bold t-step">Syzygy tables cover it? (≤ 5 pieces, no castling)</text>
  <rect x="548" y="196" width="228" height="40" rx="8" class="on"/>
  <text x="662" y="221" text-anchor="middle" class="label bold t-green">Play the tablebase move</text>
  <text x="514" y="210" text-anchor="middle" class="small">yes</text>
  <text x="270" y="254" class="small">no</text>

  <!-- 3. search -->
  <rect x="40" y="264" width="440" height="72" rx="8" class="step"/>
  <text x="260" y="290" text-anchor="middle" class="label bold t-step">Iterative deepening: depth 1, 2, 3…</text>
  <text x="260" y="310" text-anchor="middle" class="label t-step">alpha-beta, transposition table, quiescence</text>
  <text x="260" y="330" text-anchor="middle" class="label t-step">leaves scored by the model's evaluation</text>
  <rect x="548" y="264" width="228" height="72" rx="8" class="on"/>
  <text x="662" y="296" text-anchor="middle" class="label bold t-green">Play the move of the</text>
  <text x="662" y="316" text-anchor="middle" class="label bold t-green">deepest finished depth</text>
  <text x="514" y="294" text-anchor="middle" class="small">time out</text>

  <!-- legend -->
  <rect x="24" y="372" width="18" height="18" rx="4" class="on"/>
  <text x="50" y="387" class="small">move played</text>
  <rect x="160" y="372" width="18" height="18" rx="4" class="step"/>
  <text x="186" y="387" class="small">test or search step</text>

  <text x="24" y="418" class="q bold">Which source chooses the move?</text>
  <text x="24" y="438" class="q">The first that applies: the book, then the tablebases, else the last finished depth.</text>
</svg>
