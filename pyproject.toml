[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai-engine"
version = "1.0.0"
description = "Chess engine with adversarial search, heuristic and machine-learning evaluation, and tactical reasoning in Prolog."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["chess>=1.10"]

[project.optional-dependencies]
ml = ["numpy>=1.26", "scikit-learn>=1.5", "joblib>=1.3", "keras>=3.3", "tensorflow>=2.16", "pandas>=2.0", "matplotlib>=3.8"]
prolog = ["pyswip>=0.3"]
data = ["zstandard>=0.22"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools]
packages = ["adversarial_search", "bots", "config", "engine", "models", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "prolog: requires SWI-Prolog (skipped when it is not installed)",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
