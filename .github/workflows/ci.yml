name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: System packages (Stockfish for the labelling tests)
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install
        run: pip install -e ".[ml,data,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Rust lint and tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python -- -D warnings
          cargo test
          cargo test --release --test techniques
      - name: Test
        run: pytest
