  <text x="20" y="229" class="">Helper 5  (size 2, phase 2)</text>
  <rect class="on" x="193" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="220.0" y="229" text-anchor="middle">search</text>
  <rect class="on" x="253" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="280.0" y="229" text-anchor="middle">search</text>
  <rect class="skip" x="313" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="340.0" y="229" text-anchor="middle">skip</text>
  <rect class="skip" x="373" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="400.0" y="229" text-anchor="middle">skip</text>
  <rect class="on" x="433" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="460.0" y="229" text-anchor="middle">search</text>
  <rect class="on" x="493" y="212" width="54" height="24" rx="4"/>
  <text class="sub" x="520.0" y="229" text-anchor="middle">search</text>
  <text class="sub" x="20" y="262">A helper never goes below the main thread's depth; it skips a depth when ((depth + phase) / size) is odd.</text>
  <text class="title" x="20" y="302">2. What the threads share</text>
  <rect class="blue" x="20" y="320" width="150" height="40" rx="6"/>
  <text x="95" y="345" text-anchor="middle" class="b">Main</text>
  <rect class="blue" x="20" y="372" width="150" height="40" rx="6"/>
  <text x="95" y="397" text-anchor="middle" class="b">Helper 1</text>
  <rect class="blue" x="20" y="424" width="150" height="40" rx="6"/>
  <text x="95" y="449" text-anchor="middle" class="b">Helper n</text>
  <rect class="on" x="330" y="320" width="450" height="64" rx="8"/>
  <text x="555" y="346" text-anchor="middle" class="b">Transposition table (shared)</text>
  <text class="sub" x="555" y="368" text-anchor="middle">lock-free; 32-byte slots, 3 words checked by XOR</text>
  <rect class="on" x="330" y="394" width="450" height="52" rx="8"/>
  <text x="555" y="418" text-anchor="middle" class="b">History scores (shared)</text>
  <text class="sub" x="555" y="436" text-anchor="middle">atomic counters, relaxed ordering</text>
  <rect class="amber" x="330" y="456" width="450" height="40" rx="8"/>
  <text x="555" y="481" text-anchor="middle" class="b">Killer moves: one set per thread (not shared)</text>
  <path class="line" d="M170 340 L330 352"/>
  <path class="line" d="M170 340 L330 420"/>
  <path class="line" d="M170 392 L330 352"/>
  <path class="line" d="M170 392 L330 420"/>
  <path class="line" d="M170 444 L330 352"/>
  <path class="line" d="M170 444 L330 420"/>
  <text class="title" x="20" y="536">3. The vote (four threads finished an iteration at depth 8 or more)</text>
  <text class="sub b" x="20" y="562">Thread</text>
  <text class="sub b" x="150" y="562">Move</text>
  <text class="sub b" x="230" y="562">Depth</text>
  <text class="sub b" x="310" y="562">Value</text>
  <text class="sub b" x="410" y="562">Weight = depth × (value − 0.50 + 0.01)</text>
  <rect class="skip" x="14" y="572" width="772" height="24" rx="4"/>
  <text x="20" y="589">Main</text>
  <text x="150" y="589">e4</text>
  <text x="230" y="589">8</text>
  <text x="310" y="589">0.52</text>
  <text x="410" y="589">8 × 0.03 = 0.24</text>
  <rect class="win" x="14" y="598" width="772" height="24" rx="4"/>
  <text x="20" y="615">Helper 1</text>
  <text x="150" y="615">d4</text>
  <text x="230" y="615">8</text>
  <text x="310" y="615">0.55</text>
  <text x="410" y="615">8 × 0.06 = 0.48</text>
  <rect class="win" x="14" y="624" width="772" height="24" rx="4"/>
  <text x="20" y="641">Helper 2</text>
  <text x="150" y="641">d4</text>
  <text x="230" y="641">9</text>
  <text x="310" y="641">0.58</text>
  <text x="410" y="641">9 × 0.09 = 0.81</text>
  <rect class="skip" x="14" y="650" width="772" height="24" rx="4"/>
  <text x="20" y="667">Helper 3</text>
  <text x="150" y="667">e4</text>
  <text x="230" y="667">8</text>
  <text x="310" y="667">0.50</text>
  <text x="410" y="667">8 × 0.01 = 0.08</text>
  <text x="20" y="696" class="b">e4: 0.24 + 0.08 = 0.32      d4: 0.48 + 0.81 = 1.29      → d4 is played (the lowest value, 0.50, is Helper 3's).</text>
</svg>
