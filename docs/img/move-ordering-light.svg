<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Move ordering in the alpha-beta search</title>
  <desc id="d">Six moves of one node, in the order the search tries them: first the move stored in the transposition table, then the captures by MVV-LVA score (NxB before PxN), then a killer move that caused a cut at this depth, then the other quiet moves by history. Below, two rows show that when the cut move is tried first, five moves are skipped; when it is tried fifth, one is skipped. The position and the scores are illustrative, not measured.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .q { font-size: 15px; }
    .label { font-size: 15px; }
    .small { font-size: 13px; }
    .bold { font-weight: 700; }
    .on { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    .cut { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
    .blue { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .gray { fill: #e5e7eb; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 5 4; }
    .edge { stroke: #15803d; stroke-width: 2.5; fill: none; }
    .edge-cut { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .t-green { fill: #14532d; }
    .t-red { fill: #7f1d1d; }
    .t-blue { fill: #1e3a8a; }
    .t-gray { fill: #374151; }
  </style>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="24" y="38" class="title">Move ordering: likely cut-off moves are tried first</text>
  <text x="24" y="62" class="small t-gray">Illustrative node, not measured. Captures score 10 × victim − attacker: NxB 28, PxN 19.</text>

  <!-- order of the moves of one node -->
  <rect x="40" y="84" width="110" height="44" rx="8" class="blue"/>
  <text x="95" y="111" text-anchor="middle" class="label bold t-blue">1. Nf3</text>
  <rect x="162" y="84" width="110" height="44" rx="8" class="on"/>
  <text x="217" y="111" text-anchor="middle" class="label bold t-green">2. NxB</text>
  <rect x="284" y="84" width="110" height="44" rx="8" class="on"/>
  <text x="339" y="111" text-anchor="middle" class="label bold t-green">3. PxN</text>
  <rect x="406" y="84" width="110" height="44" rx="8" class="on"/>
  <text x="461" y="111" text-anchor="middle" class="label bold t-green">4. Bc4</text>
  <rect x="528" y="84" width="110" height="44" rx="8" class="on"/>
  <text x="583" y="111" text-anchor="middle" class="label bold t-green">5. Qe2</text>
  <rect x="650" y="84" width="110" height="44" rx="8" class="on"/>
  <text x="705" y="111" text-anchor="middle" class="label bold t-green">6. h3</text>

  <text x="95" y="146" text-anchor="middle" class="small bold t-blue">from table</text>
  <text x="217" y="146" text-anchor="middle" class="small t-green">capture</text>
  <text x="339" y="146" text-anchor="middle" class="small t-green">capture</text>
  <text x="461" y="146" text-anchor="middle" class="small t-green">killer</text>
  <text x="583" y="146" text-anchor="middle" class="small t-green">history</text>
  <text x="705" y="146" text-anchor="middle" class="small t-green">history</text>

  <path class="edge" d="M 40 170 L 752 170"/>
  <polygon points="762,170 750,164 750,176" fill="#15803d"/>
  <text x="400" y="192" text-anchor="middle" class="small bold t-gray">tried first → tried last</text>

  <!-- why it matters -->
  <text x="24" y="226" class="q bold">Why it matters: a cut-off skips the moves that come after it</text>
  <text x="24" y="264" class="small bold t-green">Cut move first:</text>
  <rect x="160" y="244" width="52" height="30" rx="6" class="on"/>
  <text x="186" y="264" text-anchor="middle" class="label bold t-green">1</text>
  <rect x="220" y="244" width="52" height="30" rx="6" class="cut"/>
  <text x="246" y="264" text-anchor="middle" class="label bold t-red">2</text>
  <path d="M 226 259 L 268 259" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="280" y="244" width="52" height="30" rx="6" class="cut"/>
  <text x="306" y="264" text-anchor="middle" class="label bold t-red">3</text>
  <path d="M 286 259 L 328 259" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="340" y="244" width="52" height="30" rx="6" class="cut"/>
  <text x="366" y="264" text-anchor="middle" class="label bold t-red">4</text>
  <path d="M 346 259 L 388 259" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="400" y="244" width="52" height="30" rx="6" class="cut"/>
  <text x="426" y="264" text-anchor="middle" class="label bold t-red">5</text>
  <path d="M 406 259 L 448 259" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="460" y="244" width="52" height="30" rx="6" class="cut"/>
  <text x="486" y="264" text-anchor="middle" class="label bold t-red">6</text>
  <path d="M 466 259 L 508 259" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="530" y="264" class="small bold t-red">5 of 6 nodes skipped</text>

  <text x="24" y="304" class="small bold t-green">Cut move fifth:</text>
  <rect x="160" y="284" width="52" height="30" rx="6" class="on"/>
  <text x="186" y="304" text-anchor="middle" class="label bold t-green">1</text>
  <rect x="220" y="284" width="52" height="30" rx="6" class="on"/>
  <text x="246" y="304" text-anchor="middle" class="label bold t-green">2</text>
  <rect x="280" y="284" width="52" height="30" rx="6" class="on"/>
  <text x="306" y="304" text-anchor="middle" class="label bold t-green">3</text>
  <rect x="340" y="284" width="52" height="30" rx="6" class="on"/>
  <text x="366" y="304" text-anchor="middle" class="label bold t-green">4</text>
  <rect x="400" y="284" width="52" height="30" rx="6" class="on"/>
  <text x="426" y="304" text-anchor="middle" class="label bold t-green">5</text>
  <rect x="460" y="284" width="52" height="30" rx="6" class="cut"/>
  <text x="486" y="304" text-anchor="middle" class="label bold t-red">6</text>
  <path d="M 466 299 L 508 299" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="530" y="304" class="small bold t-red">1 node skipped</text>

  <!-- legend -->
  <rect x="24" y="372" width="18" height="18" rx="4" class="on"/>
  <text x="50" y="387" class="small">tried</text>
  <rect x="130" y="372" width="18" height="18" rx="4" class="blue"/>
  <text x="156" y="387" class="small">from the table</text>
  <rect x="290" y="372" width="18" height="18" rx="4" class="cut"/>
  <text x="316" y="387" class="small">skipped: never searched</text>

  <text x="24" y="418" class="q bold">Why does the order change the size of the search?</text>
  <text x="24" y="438" class="q">A cut-off skips every move after it, so the earlier the cut move, the less is searched.</text>
</svg>
