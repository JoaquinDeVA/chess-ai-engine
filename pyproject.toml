[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai-engine"
version = "1.0.0"
description = "Chess engine with adversarial search, heuristic and machine-learning evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["chess>=1.10"]

[project.optional-dependencies]
ml = ["numpy>=1.26", "joblib>=1.3", "keras>=3.3", "tensorflow>=2.16", "pandas>=2.0", "matplotlib>=3.8"]
data = ["zstandard>=0.22", "pyarrow>=15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chess_engine.evaluation" = ["h1_weights.json"]
"chess_engine.models" = ["artifacts/*", "cards/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213", "D107", "D105", "D401", "UP035", "UP006", "UP007", "UP045", "B027", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
