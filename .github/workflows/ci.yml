name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mismos pasos que scripts/check.sh; el compilador sale de rust-toolchain.toml.
jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check . && ruff format --check .

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python -- -D warnings
          cargo test

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: System packages (Stockfish for the labelling tests)
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -e ".[ml,data,dev]"
      - run: pytest -m "not slow"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: rustup show
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_docs.py
