name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (Prolog for the tactical bot, Stockfish for the labelling tests)
        run: sudo apt-get update && sudo apt-get install -y swi-prolog stockfish
      - name: Install
        run: pip install -e ".[ml,prolog,data,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
